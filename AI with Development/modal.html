<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Guru</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!----------------------- External CSS Link ------->
    <link href="external.css" type="text/css" rel="stylesheet">

</head>

<body>
<style>
    /* MODAL INPUT STYLE */
.custom-input {
    border-radius: 10px;
    padding: 12px;
    border: 1px solid #ddd;
    transition: 0.3s;
}

.custom-input:focus {
    border-color: #4e54c8;
    box-shadow: 0 0 8px rgba(78, 84, 200, 0.3);
}

/* GRADIENT BUTTON */
.btn-gradient {
    background: linear-gradient(45deg, #4e54c8, #8f94fb);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-weight: 600;
}

.btn-gradient:hover {
    opacity: 0.9;
}
</style>

<a class="btn btn-primary px-4 rounded-pill" href="#" data-bs-toggle="modal" data-bs-target="#registerModal">
    Register
</a>

<!-- REGISTER MODAL -->
<div class="modal fade" id="registerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">

            <!-- HEADER -->
            <div class="modal-header text-white" style="background: linear-gradient(135deg, #4e54c8, #8f94fb);">
                <h5 class="modal-title">🚀 Register Now</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <!-- BODY -->
            <div class="modal-body p-4">

                <form>

                    <div class="mb-3">
                        <input type="text" class="form-control custom-input" placeholder="Full Name" required>
                    </div>

                    <div class="mb-3">
                        <input type="email" class="form-control custom-input" placeholder="Email Address" required>
                    </div>

                    <div class="mb-3">
                        <input type="tel" class="form-control custom-input" placeholder="Phone Number" required>
                    </div>

                    <div class="mb-3">
                        <select class="form-control custom-input">
                            <option selected>Select Course</option>
                            <option>Full Stack Development</option>
                            <option>Frontend Development</option>
                            <option>Backend Development</option>
                            <option>AI & Machine Learning</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <textarea class="form-control custom-input" rows="3" placeholder="Message"></textarea>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 mt-2">Submit Registration</button>

                </form>

            </div>

        </div>
    </div>
</div>
</body>
</html>
