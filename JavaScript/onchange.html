<!DOCTYPE html>

<head>
    <title> Onchange Event DEMO </title>
</head>

<body>

    <button onclick="add()"> Click Me </button> <br><br>
    <div id="demo"></div>
    <p id="Ans"></p>
    <script>
        /********************* Onchange EVENT ******************/

        function add() {
            document.getElementById('demo').innerHTML = 'NO1:<input type="text" id="no1" onchange="arithmatic()">NO2:<input type="text" id="no2" onchange="arithmatic()">';
        }

        function arithmatic() {
            // alert('calling success..!');
            no1 = parseInt(document.getElementById('no1').value);
            no2 = parseInt(document.getElementById('no2').value);
            if (no1 && no2) {
                document.getElementById('Ans').innerHTML = no1 + no2;
            }

        }


    </script>
</body>

</html>
