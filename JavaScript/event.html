<!DOCTYPE html>
<head>
    <title> Event DEMO </title>
</head>
<body>
<button onclick="clickMe();"> Click Me</button>
<p id="demo"></p>
<p id="Ans"></p>

<script>
  function clickMe()
  {
     document.getElementById('demo').innerHTML='NO1: <input type="text" id="no1"> NO2:<input type="text" id="no2">&nbsp;&nbsp;<button onClick="add();">SUBMIT</button>';
  }

  function add()
  {
     no1=parseInt(document.getElementById('no1').value);
     no2=parseInt(document.getElementById('no2').value);
     Ans=no1+no2;
     document.getElementById('Ans').innerHTML=Ans;
  }
  </script>
</body>
</html>
